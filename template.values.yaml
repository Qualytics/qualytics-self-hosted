######------------------------------------------------------------
# Qualytics Configuration
# This is a simplified version of values.yaml with essential settings
######------------------------------------------------------------

#--------------------------------------------------------------------------------
# Global Configuration (REQUIRED)
#--------------------------------------------------------------------------------
global:
  # Cloud platform: aws, gcp, azure
  platform: "aws"
  # Your DNS record (REQUIRED) - the domain where Qualytics will be accessible
  dnsRecord: "your-domain.example.com"
  # Authentication authority. Exactly one of (case-sensitive — the chart rejects anything else):
  #   "DB"    — providers (OpenID Connect, SAML 2.0, or password) configured in the Qualytics
  #             database under Settings -> Access -> Providers (recommended for self-hosted)
  #   "AUTH0" — managed by Qualytics; requires egress to auth.qualytics.io (not air-gapped)
  # See docs/authentication.md.
  authType: "DB"
  # Pull secrets applied to every pod. Defaults to the regcred Secret created
  # during installation; uncomment and set to [] if your registry allows
  # unauthenticated pulls (no regcred Secret needed). See docs/docker-images.md.
  # imagePullSecrets: []

#--------------------------------------------------------------------------------
# Deployment and Authentication Configuration (REQUIRED)
# Choose ONE of the following: database-backed providers OR Auth0
# See: docs/authentication.md
# See: https://userguide.qualytics.io/deployments/auth0-setup/
#--------------------------------------------------------------------------------
secrets:
  # Required. Paste the identifier provided by Qualytics for this deployment.
  # Do not reuse it for another installation.
  deployment:
    identifier: ""

  # --- Option A: Database-backed providers (recommended for self-hosted) ---
  # No identity-provider values are needed in Helm. After installation, open the
  # login page, create the first administrator account, then configure your
  # identity provider (OpenID Connect or SAML 2.0) or password sign-in under
  # Settings -> Access -> Providers. Optional deployment-wide settings:
  # oidc:
  #   # Add users to Teams whose names match their IdP groups (add-only, case-insensitive).
  #   oidc_group_team_sync_enabled: false
  #   # Development only: allow HTTP (non-TLS) identity provider endpoints.
  #   oidc_allow_insecure_transport: false

  # --- Option B: Auth0 (managed by Qualytics) ---
  # Uncomment and configure if using authType: "AUTH0"
  # Values provided by your Qualytics account manager
  # auth0:
  #   auth0_domain: auth.qualytics.io
  #   auth0_audience: changeme-api
  #   auth0_organization: org_changeme
  #   auth0_spa_client_id: spa_client_id

  # ------------------------------------------------------------------------------
  # System secrets — YOU MUST REPLACE THESE BEFORE INSTALLING
  #
  # `jwt_signing_secret` and `secrets_passphrase` are enforced: a fresh install is
  # rejected while either still reads `ChangeMe!`, and `helm install` fails with a
  # message naming the value. They are left as the known-bad placeholder deliberately,
  # so a forgotten value fails closed instead of quietly shipping a weak but working
  # default. `password` and `rabbitmq_password` are not enforced — change them anyway.
  #
  # Generate each one separately:
  #   openssl rand -base64 32
  # ------------------------------------------------------------------------------
  auth:
    # REQUIRED — signs browser session JWTs. Under authType "DB" this key is the sole
    # session authority: anyone who knows it can mint valid sessions for your deployment.
    # Replace with `openssl rand -base64 32`. Rotating it logs everyone out.
    jwt_signing_secret: ChangeMe!
  postgres:
    password: postgres
    # REQUIRED — encrypts secrets stored in the database: datastore credentials, API keys,
    # integration tokens, IdP client secrets, and SAML certificates.
    # Replace with `openssl rand -base64 32`, then keep it safe: without it the encrypted
    # columns cannot be read. Do NOT edit it in place later — rotate it with the two-upgrade
    # process in docs/authentication.md.
    secrets_passphrase: ChangeMe!
    # Rotation only — leave both unset for a new install.
    #
    # new_secrets_passphrase stages the replacement passphrase for phase 1 of the rotation.
    # secrets_migration_id is a MONOTONIC COUNTER shared with this deployment's database
    # (it starts at 1). Increment it by exactly one per rotation, always together with
    # new_secrets_passphrase — the chart rejects a staged passphrase left at 1.
    #
    # NEVER reset or lower secrets_migration_id, and carry it forward for the lifetime of
    # the deployment: once you have rotated, re-rendering 1 from a fresh copy of this
    # template stops Hub API from starting while Hub CMD keeps running.
    #
    # new_secrets_passphrase: ""
    # secrets_migration_id: 1
  rabbitmq:
    rabbitmq_password: ChangeMe!
  # SMTP AUTH credentials — only set when your SMTP server requires authentication.
  # Leave unset (or empty) for relays without SMTP AUTH, e.g. an internal relay on
  # port 25: Qualytics then sends without attempting authentication.
  # smtp:
  #   smtp_sender_user: "ChangeMe"
  #   smtp_sender_password: "ChangeMe!"

#--------------------------------------------------------------------------------
# Node Scheduling (OPTIONAL - remove if not using node selectors)
#--------------------------------------------------------------------------------
# Uncomment and configure if using dedicated node groups
appNodeSelector:
  appNodes: "true"
driverNodeSelector:
  driverNodes: "true"
executorNodeSelector:
  executorNodes: "true"

#--------------------------------------------------------------------------------
# Dependencies
#--------------------------------------------------------------------------------
# spark-operator is no longer required — the dataplane runs as a native
# Deployment that invokes spark-submit in client mode and creates executor
# pods directly via the Kubernetes API. See `dataplane.rbac` below for the
# ServiceAccount/Role/RoleBinding that replace what the operator chart used
# to install.

nginx:
  enabled: false
  controller:
    nodeSelector:
      appNodes: "true"

#--------------------------------------------------------------------------------
# Ingress Configuration
#--------------------------------------------------------------------------------
# Before `helm install`, create a TLS Secret in the release namespace. Recommended
# pattern (a single wildcard/SAN cert used for both api and frontend):
#
#   kubectl create secret tls qualytics-tls-cert -n qualytics \
#     --cert=fullchain.pem --key=privkey.pem
#
# Then set ingress.tls.secretName below. See docs/ingress-tls.md for all options,
# including the legacy split-Secret mode (api-tls-cert + frontend-tls-cert) which
# is automatically used when ingress.tls.secretName is empty.
ingress:
  enabled: true
  cors: false
  tls:
    # Single shared Secret for both api and frontend (recommended for new deployments).
    # Leave empty to keep the legacy `api-tls-cert` + `frontend-tls-cert` split pair.
    secretName: "qualytics-tls-cert"

#--------------------------------------------------------------------------------
# Controlplane Configuration
#--------------------------------------------------------------------------------
controlplane:
  smtp:
    # SMTP AUTH credentials (if your server requires them) go under secrets.smtp above.
    enabled: false
    server: "email-smtp.us-east-1.amazonaws.com"
    sender: "no-reply@qualytics.co"
    port: "465"
  egress:
    verifyTLSCertificates: true
    # Optional; missing metadata is estimated automatically at runtime.
    configMapName: qualytics-egress-info
  # Give the hub pods a cloud identity of their own. Required for AgentQ's Amazon Bedrock
  # IAM Role authentication; without it the pods inherit the node's identity, which is shared
  # with every other pod on that node. See docs/controlplane-aws-identity.md.
  # serviceAccount:
  #   create: true
  #   # EKS Pod Identity needs nothing else here. For IRSA, add the role annotation:
  #   annotations:
  #     eks.amazonaws.com/role-arn: "arn:aws:iam::<account>:role/<role name>"

#--------------------------------------------------------------------------------
# Dataplane configuration
#--------------------------------------------------------------------------------
dataplane:
  enabled: true
  numVolumes: -1
  parallelismScaleFactor: -1
  # Air-gapped clusters: resolve the Teradata/DB2 JDBC drivers from an internal
  # Maven repository instead of Maven Central — see docs/custom-maven-repository.md.
  # ivy:
  #   enabled: true
  #   repositoryUrl: "https://repo.example.com/artifactory/maven-remote/"
  #   realm: "Artifactory Realm"
  #   username: "svc-user"      # optional — set both or neither
  #   password: "<token>"
  # I/O-bound sync ceiling; the dataplane's CPU governor (values.yaml syncAdmission) scales
  # live capacity beneath it. See values.yaml for the floor/watermark knobs (QUA-2100).
  maxParallelSyncRequests: 24
  # RBAC the driver needs to manage executor pods (replaces the spark-operator
  # SA/Role bundle). For AWS IRSA, add the role-arn annotation here:
  rbac:
    create: true
    serviceAccountName: "qualytics-spark"
    # serviceAccountAnnotations:
    #   eks.amazonaws.com/role-arn: "arn:aws:iam::<account-id>:role/<tenant>-dataplane-connector-role"
  driver:
    cores: 7
    memory: "55000m"
  dynamicAllocation:
    enabled: true
    initialExecutors: 1
    minExecutors: 1
    maxExecutors: 12
  executor:
    instances: 1
    cores: 7
    memory: "55000m"

#--------------------------------------------------------------------------------
# Storage Configuration
#--------------------------------------------------------------------------------
postgres:
  # Use a custom schema only when required by your database policy.
  schema: "public"
  enabled: true
  pvc:
    storageSize: "50Gi"
    backupStorageSize: "25Gi"

rabbitmq:
  pvc:
    storageSize: "5Gi"
