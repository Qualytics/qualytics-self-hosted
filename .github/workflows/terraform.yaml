name: Validate Terraform

on:
  pull_request:
    branches: [ main ]
    paths: [ 'terraform/**' ]
  push:
    branches: [ main ]
    paths: [ 'terraform/**' ]
  workflow_call:

# These jobs only read the repository. Declared explicitly so the token does not
# inherit a broader repository-wide default.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - terraform/aws/cluster
          - terraform/aws/postgres
          - terraform/gcp
          - terraform/azure
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.11.1
          terraform_wrapper: false

      # Providers and modules are downloaded, but no backend is configured and no
      # credentials are needed — this never contacts a cloud API.
      - name: Initialize
        working-directory: ${{ matrix.module }}
        run: terraform init -backend=false -input=false

      - name: Validate
        working-directory: ${{ matrix.module }}
        run: terraform validate -no-color

  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.11.1
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive -diff terraform/
