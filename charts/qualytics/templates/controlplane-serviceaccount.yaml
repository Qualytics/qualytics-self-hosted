{{- /*
Workload identity for the hub api and cmd pods.

Without this the pods run under the namespace default ServiceAccount with no cloud identity, so
anything reading ambient cloud credentials — AgentQ's Bedrock IAM-role authentication being the
first — falls through to the node instance role. That is node-scoped and shared with every other
pod on the node, which in a multi-tenant cluster is the wrong grain entirely.

The object carries no cloud-specific fields of its own: EKS Pod Identity binds to it by name from
the AWS side and needs no annotation, while IRSA, GKE Workload Identity and Azure workload identity
are each one entry in serviceAccount.annotations.
*/ -}}
{{- $sa := .Values.controlplane.serviceAccount | default dict -}}
{{- if $sa.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "qualytics.controlplane.serviceAccountName" . }}
  labels:
    app: {{ .Release.Name }}-controlplane
  {{- with $sa.annotations }}
  annotations:
    {{- range $k, $v := . }}
    {{ $k }}: {{ $v | quote }}
    {{- end }}
  {{- end }}
{{- end }}
