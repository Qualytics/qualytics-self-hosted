{{- /*
Optional workload identity for the hub api and cmd pods. EKS Pod Identity binds by name;
other workload-identity systems can use serviceAccount.annotations.
*/ -}}
{{- $sa := .Values.controlplane.serviceAccount | default dict -}}
{{- if $sa.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "qualytics.controlplane.serviceAccountName" . }}
  labels:
    app: {{ .Release.Name }}-controlplane
    chart: "{{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}"
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
  {{- with $sa.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
