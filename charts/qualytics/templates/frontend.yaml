{{- include "qualytics.validate.authType" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # No surge: app nodes are packed to their requests, so replacements reuse the freed slots.
      # Everything but one pod may cycle at once; a single replica degrades to replace-in-place.
      maxSurge: 0
      maxUnavailable: {{ max 1 (sub .Values.frontend.replicas 1) }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-frontend
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-frontend
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      {{- if .Values.appNodeSelector }}
      nodeSelector:
        {{- toYaml .Values.appNodeSelector | nindent 8 }}
      {{- end }}
      {{- if .Values.tolerations.appNodeTolerations }}
      tolerations:
        {{- toYaml .Values.tolerations.appNodeTolerations | nindent 8 }}
      {{- end }}
      # Soft spread so a drained node leaves pods serving elsewhere; single-node installs still schedule.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: {{ .Release.Name }}-frontend
      containers:
      - name: cfa
        image: "{{ tpl .Values.global.imageUrls.frontendImageUrl . }}:{{ .Values.frontendImage.image.frontendImageTag }}"
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            memory: {{ .Values.frontend.resources.requests.memory }}
            cpu: {{ .Values.frontend.resources.requests.cpu }}
          limits:
            memory: {{ .Values.frontend.resources.limits.memory }}
        ports:
          - containerPort: {{ .Values.frontend.ingress.servicePort }}
        lifecycle:
          preStop:
            # Let ingress-nginx withdraw this endpoint before nginx stops accepting connections.
            exec:
              command: ["sleep", "5"]
        startupProbe:
          httpGet:
            path: /health
            port: {{ .Values.frontend.ingress.servicePort }}
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 12
        readinessProbe:
          httpGet:
            path: /health
            port: {{ .Values.frontend.ingress.servicePort }}
          periodSeconds: 15
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: {{ .Values.frontend.ingress.servicePort }}
          periodSeconds: 30
          timeoutSeconds: 3
          failureThreshold: 5
        env:
          - name: VITE_QUALYTICS_DNS
            value: {{ tpl .Values.global.dnsRecord . | quote }}
          - name: VITE_QUALYTICS_API_LOCATION
            value: "https://$(VITE_QUALYTICS_DNS)/api"
          - name: VITE_QUALYTICS_DISABLE_DOWNLOADS
            value: {{ .Values.frontend.disableDownloads | quote }}
          - name: VITE_QUALYTICS_AUTH_PROVIDER
            value: DB

---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-frontend-service
  labels:
    app: {{ .Release.Name }}-frontend-service
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.frontend.ingress.servicePort }}
      targetPort: {{ .Values.frontend.ingress.servicePort }}
      protocol: TCP
      name: http
  selector:
    app: {{ .Release.Name }}-frontend
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Release.Name }}-frontend
spec:
  # Same policy as the rollout: a drain may take every pod but one. maxUnavailable never reaches
  # zero, so a single-replica install cannot pin a node the way a minAvailable budget would.
  maxUnavailable: {{ max 1 (sub .Values.frontend.replicas 1) }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-frontend
