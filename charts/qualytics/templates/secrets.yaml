{{- include "qualytics.validate.authType" . -}}
{{- include "qualytics.validate.secretsRotation" . -}}
{{- if and .Release.IsInstall (eq .Values.secrets.postgres.secrets_passphrase "ChangeMe!") -}}
{{- fail "secrets.postgres.secrets_passphrase must be set to a unique, strong value for new installations" -}}
{{- end }}
{{- /* The JWT signing secret is the browser-session authority in every auth mode, and the
       sole one under global.authType "DB". A published default lets anyone mint valid
       sessions, so a fresh install is rejected until it is replaced. */ -}}
{{- if and .Release.IsInstall (eq .Values.secrets.auth.jwt_signing_secret "ChangeMe!") -}}
{{- fail "secrets.auth.jwt_signing_secret must be set to a unique, strong value for new installations" -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: qualytics-creds
type: Opaque
data:
{{- if ( eq .Values.global.authType "AUTH0" ) }}
  auth0_audience: {{ .Values.secrets.auth0.auth0_audience | b64enc }}
  auth0_organization: {{ .Values.secrets.auth0.auth0_organization | b64enc }}
  auth0_spa_client_id: {{ .Values.secrets.auth0.auth0_spa_client_id | b64enc }}
{{- end }}
  connection_url: {{ include "qualytics.postgres.connection_url" . | b64enc }}
  secrets_passphrase: {{ .Values.secrets.postgres.secrets_passphrase | b64enc }}
{{- if .Values.secrets.postgres.new_secrets_passphrase }}
  new_secrets_passphrase: {{ .Values.secrets.postgres.new_secrets_passphrase | b64enc }}
{{- end }}
  jwt_signing_secret: {{ .Values.secrets.auth.jwt_signing_secret | b64enc }}
  deployment_identifier: {{ required "secrets.deployment.identifier is required — the Qualytics control plane will not start without the deployment identifier issued by Qualytics (delivered alongside your image-registry token)." .Values.secrets.deployment.identifier | b64enc }}
  rabbitmq_password: {{ .Values.secrets.rabbitmq.rabbitmq_password | b64enc }}
{{- if and .Values.secrets.smtp.smtp_sender_user .Values.secrets.smtp.smtp_sender_password }}
  smtp_sender_user: {{ .Values.secrets.smtp.smtp_sender_user | b64enc }}
  smtp_sender_password: {{ .Values.secrets.smtp.smtp_sender_password | b64enc }}
{{- end }}
{{- with .Values.secrets.observability.logfire_token }}
  logfire_token: {{ . | b64enc }}
{{- end }}
{{- with .Values.secrets.observability.otlp_headers }}
  otlp_headers: {{ . | b64enc }}
{{- end }}
