######------------------------------------------------------------
# Qualytics default values
######------------------------------------------------------------

#--------------------------------------------------------------------------------
# Dependencies
#--------------------------------------------------------------------------------
# Note: spark-operator is no longer required. The dataplane runs as a native
# Deployment that invokes spark-submit in client mode and creates executor
# pods directly via the Kubernetes API. RBAC for executor management lives
# under `dataplane.rbac` below.

nginx:
  enabled: false
  controller:
    nodeSelector: {}
    #   appNodes: "true"
    # tolerations:
    #   - key: appNodes
    #     operator: Equal
    #     value: "true"
    #     effect: NoSchedule
    admissionWebhooks:
      enabled: true
      timeoutSeconds: 30
    config:
      annotations-risk-level: "Critical"
      allow-snippet-annotations: "true"
      hsts-max-age: "31536000"
    service:
      type: LoadBalancer
      externalTrafficPolicy: Local
      # annotations:
      #   service.beta.kubernetes.io/aws-load-balancer-backend-protocol: tcp
      #   service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: 'true'
      #   service.beta.kubernetes.io/aws-load-balancer-type: nlb

#--------------------------------------------------------------------------------
# App Ingresses
#--------------------------------------------------------------------------------
ingress:
  enabled: false
  cors: false
  maxRequestsPerSecondPerIP: 50
  # Burst multiplier for rate limiting: burst bucket = rps * multiplier.
  # Allows short bursts (e.g. SPA page loads firing many parallel API calls)
  # without throttling, while still capping sustained abuse.
  burstMultiplier: 5
  # Concurrent open connections allowed per IP before returning 503.
  # Note: unlike rps limiting (which returns 429), connection limiting always
  # returns 503 (nginx limitation). Set high enough that normal users never hit it.
  maxConnectionsPerIP: 250
  # Frontend rate limiting: set very high to allow parallel asset loading
  # (typical SPA loads 50-100 assets at once) while still capping DDoS floods.
  frontendMaxRequestsPerSecondPerIP: 500
  frontendMaxConnectionsPerIP: 1000
  # TLS Secrets — Bring Your Own. Create the referenced `kubernetes.io/tls` Secret
  # in the release namespace before installing. See docs/ingress-tls.md.
  tls:
    # Recommended for new deployments: set `secretName` to a single wildcard
    # (or SAN) Secret used by both the API and frontend ingresses. When set,
    # it takes precedence over `apiSecretName` / `frontendSecretName` below.
    secretName: ""
    # Per-ingress Secret names. These are the zero-config defaults; existing
    # installs that already have `api-tls-cert` + `frontend-tls-cert` Secrets
    # keep working without any values changes.
    apiSecretName: "api-tls-cert"
    frontendSecretName: "frontend-tls-cert"

#--------------------------------------------------------------------------------
# Global values
#--------------------------------------------------------------------------------

# Keep this for dns records and other specifics that are used across the entire app
global:
  platform: "aws"
  deploymentMode: "kubernetes" # kubernetes | databricks
  dnsRecord: "changeme.qualytics.io"
  # Authentication authority: AUTH0 or OIDC preserve the legacy configuration;
  # DB enables the database-backed provider configurations.
  authType: "AUTH0"
  # Names of the Secrets used to pull container images, applied to every pod
  # (control plane, frontend, Spark driver and executors, postgres, rabbitmq,
  # utility pods). Defaults to the `regcred` Secret created during
  # installation. Set to [] when your registry allows unauthenticated pulls
  # (e.g. an internal Artifactory mirror) — no imagePullSecrets are rendered
  # and the regcred Secret is not required.
  imagePullSecrets:
    - regcred
  imageUrls:
    controlplaneImageUrl: "qualyticsai/controlplane"
    dataplaneImageUrl: "qualyticsai/dataplane"
    frontendImageUrl: "qualyticsai/frontend"

# Platform image tags
controlplaneImage:
  image:
    controlplaneImageTag: "20260810-885cc39"
dataplaneImage:
  image:
    dataplaneImageTag: "20260810-b133a11"
frontendImage:
  image:
    frontendImageTag: "20260810-53a99e5"

# Storage classes
storageClass:
  create: false
  name: ""

# Node scheduling
appNodeSelector: {}
#   appNodes: "true"
driverNodeSelector: {}
#   driverNodes: "true"
executorNodeSelector: {}
#   executorNodes: "true"

tolerations:
  appNodeTolerations: []
  #     - key: appNodes
  #       operator: Equal
  #       value: "true"
  #       effect: NoSchedule
  driverNodeTolerations: []
  #     - key: driverNodes
  #       operator: Equal
  #       value: "true"
  #       effect: NoSchedule
  executorNodeTolerations: []
  #     - key: executorNodes
  #       operator: Equal
  #       value: "true"
  #       effect: NoSchedule

#--------------------------------------------------------------------------------
# Secrets
#--------------------------------------------------------------------------------
secrets:
  deployment:
    # Required. Paste the identifier provided by Qualytics for this deployment.
    # Do not reuse it for another installation.
    identifier: ""
  auth0: # required for authType AUTH0 (the default)
    auth0_domain: auth.qualytics.io
    auth0_audience: changeme-api
    auth0_organization: org_changeme
    auth0_spa_client_id: spa_client_id
  oidc: # required for authType OIDC
    # Discovery URL (recommended) — auto-discovers authorization_endpoint, token_endpoint,
    # userinfo_endpoint, jwks_uri, and issuer from the IdP's .well-known/openid-configuration.
    # When set, the 3 endpoint fields below become optional (used as fallbacks only).
    oidc_discovery_url: ""
    oidc_scopes: "openid,email,profile"
    # Endpoint overrides — leave empty when using oidc_discovery_url
    oidc_authorization_endpoint: ""
    oidc_token_endpoint: ""
    oidc_userinfo_endpoint: ""
    # Token endpoint auth method — auto-detected from discovery doc if empty.
    # Set to "client_secret_basic" for IdPs that only accept Basic auth.
    # Set to "client_secret_post" for IdPs that reject duplicate credentials (e.g., Okta).
    oidc_token_auth_method: ""
    # OAuth2 client credentials (required)
    oidc_client_id: ""
    oidc_client_secret: ""
    # Claims mapping — OIDC-standard defaults work for most IdPs
    oidc_user_id_key: "sub"
    oidc_user_email_key: "email"
    oidc_user_name_key: "name"
    oidc_user_fname_key: "given_name"
    oidc_user_lname_key: "family_name"
    oidc_user_picture_key: "picture"
    oidc_user_provider_key: "iss"
    # Claim holding the user's group listing (maps to OIDC_USER_GROUPS_KEY). The listing is always
    # recorded per user (shown in the user's IdP-groups view for diagnosing mapping). Set to whatever
    # claim your IdP emits (e.g. "groups", "roles"). Note: the IdP must actually emit this claim —
    # that often requires requesting an extra scope via oidc_scopes above (e.g. "groups").
    oidc_user_groups_key: "groups"
    # Enable add-only, case-insensitive group→Team membership sync (maps to OIDC_GROUP_TEAM_SYNC_ENABLED).
    # When true, a user is added to any Team whose name matches a presented group; users are never
    # removed. Default false (opt-in) because it grants Team membership — and thus data access — from
    # IdP claims. The group listing above is recorded regardless of this setting.
    oidc_group_team_sync_enabled: false
    oidc_allow_insecure_transport: false
    # oidc_jwt_ttl_minutes: 60
    # oidc_signer_pem_url: "https://www.digicert.com/CACerts/DigiCertGlobalRootG2.crt.pem"
  auth:
    # Must be replaced for a fresh install — the chart rejects the ChangeMe! default.
    # This key signs the browser session JWTs and is the sole session authority under
    # global.authType "DB", so a published default lets anyone mint valid sessions.
    # Generate with: openssl rand -base64 32
    jwt_signing_secret: ChangeMe!
  postgres:
    host: postgres
    port: 5432
    database: surveillance_hub
    username: postgres
    password: postgres
    # Must be replaced for a fresh install. Existing installations rotate this
    # explicitly with new_secrets_passphrase and secrets_migration_id below.
    # See docs/authentication.md for the two-upgrade rotation runbook.
    secrets_passphrase: ChangeMe!
    new_secrets_passphrase: ""
    # Monotonic counter shared with the qualytics_metadata.secrets_migration_id column in
    # this deployment's database. NEVER reset or lower it — it must be preserved for the
    # lifetime of the deployment. After the first rotation the database counter is
    # permanently >= 2; re-rendering 1 from a regenerated values file makes Hub API refuse
    # to start while Hub CMD (which performs no parity check) keeps running — an asymmetric
    # split-brain. Increment by exactly one per rotation, and only alongside
    # new_secrets_passphrase; the chart rejects a staged passphrase left at id 1.
    secrets_migration_id: 1
  smtp:
    # SMTP AUTH credentials. Leave both empty when your SMTP server does not require
    # authentication (e.g. an internal relay on port 25) — Qualytics then sends without
    # attempting SMTP AUTH. Setting any non-empty values here forces an AUTH attempt,
    # which servers lacking the AUTH extension reject.
    smtp_sender_user: ""
    smtp_sender_password: ""
  rabbitmq:
    rabbitmq_password: ChangeMe!


#--------------------------------------------------------------------------------
# Dataplane configuration
#--------------------------------------------------------------------------------
dataplane:
  enabled: true
  sparkVersion: "4.1.1"
  eventLog: false
  numVolumes: -1
  parallelismScaleFactor: -1
  # Ceiling on concurrent synchronous operations (catalog, metadata, preview, connection tests).
  # These are overwhelmingly datastore-I/O-bound, so the ceiling sits well above driver core count;
  # the dataplane's CPU governor scales live capacity between syncAdmission.floor and this ceiling
  # based on measured driver CPU
  maxParallelSyncRequests: 24
  # Sync-admission CPU governor. The governor halves live sync capacity when process CPU is at/above
  # cpuHighWatermark, grows it when at/below cpuLowWatermark, and never drops below floor. Requires
  # 0.0 <= cpuLowWatermark < cpuHighWatermark <= 1.0; invalid values fall back to the dataplane
  # defaults (floor 3, high 0.80, low 0.50).
  syncAdmission:
    floor: 3
    cpuHighWatermark: 0.80
    cpuLowWatermark: 0.50
  memoryOverheadFactor: 0.1
  libpostalDataPath: "/opt/libpostal"
  extraPackages:
    - "com.teradata.jdbc:terajdbc:20.00.00.56"
    - "com.ibm.db2:jcc:12.1.4.0"
  # Resolve extraPackages from an internal Maven repository (Artifactory/Nexus)
  # instead of Maven Central — for air-gapped clusters. The chart renders an
  # ivysettings.xml into a Secret and points spark.jars.ivySettings at it;
  # only the driver needs access to the repository, which must serve every
  # coordinate in extraPackages. See docs/custom-maven-repository.md.
  ivy:
    enabled: false
    # Maven-layout repository URL, e.g. an Artifactory repo proxying Maven Central.
    repositoryUrl: ""
    # HTTP Basic realm ("Artifactory Realm" is the Artifactory default).
    realm: "Artifactory Realm"
    # Set both for authenticated access or leave both empty for anonymous.
    # Prefer an identity token / API key over a real password.
    username: ""
    password: ""
  # RBAC for the driver pod to manage executor pods directly. Replaces the
  # spark-operator's spark/serviceaccount.yaml and spark/rbac.yaml.
  rbac:
    # When true, create the ServiceAccount + Role + RoleBinding. Set to false
    # to BYO an existing SA in clusters with restricted RBAC.
    create: true
    serviceAccountName: "qualytics-spark"
    # Annotations on the driver ServiceAccount.
    # For AWS IRSA (IAM Roles for Service Accounts), add:
    #   eks.amazonaws.com/role-arn: "arn:aws:iam::<account-id>:role/<role-name>"
    serviceAccountAnnotations: {}
  driver:
    cores: 7
    memory: "55000m"
  dynamicAllocation:
    enabled: true
    initialExecutors: 1
    minExecutors: 1
    maxExecutors: 12
  executor:
    ## Note that if dynamic allocation is enabled, the number of executors to request initially is set to the biggest
    # of .spec.dynamicAllocation.initialExecutors and .spec.executor.instances if both are set.
    instances: 1
    cores: 7
    memory: "55000m"
  kerberos:
    enabled: false
    krb5: ""
    keytab: ""
    principal: ""

#--------------------------------------------------------------------------------
# Controlplane configuration
#--------------------------------------------------------------------------------
controlplane:
  replicas: 4
  ingress:
    path: "/api/?(.*)"
    servicePort: "8000"
  resources:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "4Gi"
  smtp:
    enabled: true
    server: "email-smtp.us-east-1.amazonaws.com"
    sender: "no-reply@qualytics.ai"
    port: "465"
  auth:
    # SCIM username prefix
    scimUsernamePrefix: ""
    # Set to true when your identity provider is hosted inside your own network and resolves to a
    # private address (10.x, 172.16-31.x, 192.168.x). Requests to auth provider endpoints —
    # discovery, token exchange, userinfo, JWKS, SAML2 metadata, and the provider diagnostics in
    # Settings > Access — otherwise accept publicly routable addresses only, so an internal IdP
    # fails login with "Unable to complete the token exchange with the identity provider" and the
    # API log records "SSRF blocked: <idp-host> resolved to unsafe IP <address>".
    # Cloud metadata (169.254.0.0/16) and multicast stay blocked either way, and this affects auth
    # provider endpoints only — datastore connectivity, notifications, and integrations are
    # unchanged. Leave false when your IdP is reachable at a public address.
    allowPrivateNetworkFetches: false
    # When false, Qualytics-issued API/service tokens (Bearer auth) are rejected.
    # Set to false to force all access through OIDC cookie-based auth only.
    allowQualyticsIssuer: true
  # Controls certificate validation for all requests, httpx, and smtp_ssl sessions
  egress:
    verifyTLSCertificates: true

controlplaneCmd:
  resources:
    requests:
      memory: "4Gi"
      cpu: "1000m"
    limits:
      memory: "6Gi"

#--------------------------------------------------------------------------------
# Frontend configuration
#--------------------------------------------------------------------------------
frontend:
  replicas: 2
  disableDownloads: false
  ingress:
    path: "/?(.*)"
    servicePort: "8080"
  resources:
    requests:
      memory: "128Mi"
      cpu: "200m"
    limits:
      memory: "512Mi"

#--------------------------------------------------------------------------------
# Postgres
#--------------------------------------------------------------------------------
postgres:
  enabled: true
  pvc:
    storageSize: "100Gi"
    backupStorageSize: "100Gi"
  image:
    imageUrl: "postgres"
    imageTag: "17"
  # Use this image for auto upgrade
  # image:
  #   imageUrl: "pgautoupgrade/pgautoupgrade"
  #   imageTag: "17-bookworm"
  resources:
    requests:
      memory: "10Gi"
      cpu: "1000m"
    limits:
      memory: "12Gi"
  cronjobs:
    snapshotter:
      resources:
        requests:
          memory: "1Gi"
          cpu: "500m"
        limits:
          memory: "2Gi"
    maintenance:
      resources:
        requests:
          memory: "512Mi"
          cpu: "250m"
        limits:
          memory: "1Gi"
  tls:
    # When true, Postgres mounts the `postgres-tls` Secret at /etc/certs.
    # Create a `kubernetes.io/tls` Secret named `postgres-tls` in the release
    # namespace before enabling. See docs/ingress-tls.md.
    enabled: false
  # PostgreSQL schema used by the controlplane.
  schema: "public"

#--------------------------------------------------------------------------------
# RabbitMQ
#--------------------------------------------------------------------------------
rabbitmq:
  # Defaults to emptyDir (node-local disk). RabbitMQ state is recoverable from
  # the controlplane on restart, so a 10 GiB PVC is overkill for most installs.
  # Set pvc.enabled to true if you need persistence across pod-host evictions.
  pvc:
    enabled: false
    storageSize: "10Gi"
  image:
    imageUrl: "rabbitmq"
    imageTag: "4.3-management"
  resources:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "2Gi"
  tls:
    # When true, RabbitMQ mounts the `rabbitmq-tls` Secret and serves AMQPS on 5671.
    # Create a `kubernetes.io/tls` Secret named `rabbitmq-tls` in the release
    # namespace before enabling. See docs/ingress-tls.md.
    enabled: false
  # When true, opens AMQP-TLS on nodePort 30671 via a dedicated
  # <release>-rabbitmq-inbound Service. clusterIP is immutable — legacy inbound
  # clusters must delete the governing Service once before upgrading.
  enableInbound: false

#--------------------------------------------------------------------------------
# Busybox
#--------------------------------------------------------------------------------
busybox:
  image:
    imageUrl: "busybox"
    imageTag: "latest"
