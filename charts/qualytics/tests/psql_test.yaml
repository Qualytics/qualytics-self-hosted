suite: test psql deployment
templates:
  - postgres.yaml
tests:
  - it: should render psql deployment when postgres is enabled
    set:
      postgres.enabled: true
    asserts:
      - hasDocuments:
          count: 1
          filterAware: true
        documentSelector:
          path: metadata.name
          value: RELEASE-NAME-psql
      - isKind:
          of: Deployment
        documentSelector:
          path: metadata.name
          value: RELEASE-NAME-psql

  - it: should render psql deployment when postgres is disabled (external)
    set:
      postgres.enabled: false
    asserts:
      - hasDocuments:
          count: 1
          filterAware: true
        documentSelector:
          path: metadata.name
          value: RELEASE-NAME-psql
      - isKind:
          of: Deployment
        documentSelector:
          path: metadata.name
          value: RELEASE-NAME-psql

  - it: should create psql deployment with correct configuration
    set:
      postgres.enabled: true
    asserts:
      - equal:
          path: metadata.name
          value: "RELEASE-NAME-psql"
        documentSelector:
          path: metadata.name
          value: RELEASE-NAME-psql
      - equal:
          path: spec.replicas
          value: 0
        documentSelector:
          path: metadata.name
          value: RELEASE-NAME-psql

  - it: should use correct image
    set:
      postgres.enabled: true
      postgres.image.imageUrl: "custom/postgres"
      postgres.image.imageTag: "v1.0.0"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: "custom/postgres:v1.0.0"
        documentSelector:
          path: metadata.name
          value: RELEASE-NAME-psql

  - it: should set correct container command
    set:
      postgres.enabled: true
    asserts:
      - equal:
          path: spec.template.spec.containers[0].command[0]
          value: "/bin/bash"
        documentSelector:
          path: metadata.name
          value: RELEASE-NAME-psql
      - equal:
          path: spec.template.spec.containers[0].command[1]
          value: "-c"
        documentSelector:
          path: metadata.name
          value: RELEASE-NAME-psql

  - it: should mount backup volume when postgres is enabled
    set:
      postgres.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: "postgres-snapshots-pvc"
            persistentVolumeClaim:
              claimName: "postgres-snapshots-claim"
        documentSelector:
          path: metadata.name
          value: RELEASE-NAME-psql
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: "postgres-snapshots-pvc"
            mountPath: "/mnt/postgres/data"
        documentSelector:
          path: metadata.name
          value: RELEASE-NAME-psql

  - it: should not mount volumes when postgres is disabled (external)
    set:
      postgres.enabled: false
    asserts:
      - isNull:
          path: spec.template.spec.volumes
        documentSelector:
          path: metadata.name
          value: RELEASE-NAME-psql
      - isNull:
          path: spec.template.spec.containers[0].volumeMounts
        documentSelector:
          path: metadata.name
          value: RELEASE-NAME-psql

  - it: should inject DATABASE_URL from qualytics-creds secret when postgres is disabled (external)
    set:
      postgres.enabled: false
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: qualytics-creds
                key: connection_url
        documentSelector:
          path: metadata.name
          value: RELEASE-NAME-psql

  - it: should not inject DATABASE_URL when postgres is enabled
    set:
      postgres.enabled: true
    asserts:
      - isNull:
          path: spec.template.spec.containers[0].env
        documentSelector:
          path: metadata.name
          value: RELEASE-NAME-psql

  - it: should have correct node selector when configured
    set:
      postgres.enabled: true
      appNodeSelector:
        appNodes: "true"
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector.appNodes
          value: "true"
        documentSelector:
          path: metadata.name
          value: RELEASE-NAME-psql

  # Resource limits
  - it: should have default memory limit at 2x requests for psql
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 100Mi
        documentSelector:
          path: metadata.name
          value: RELEASE-NAME-psql
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 200Mi
        documentSelector:
          path: metadata.name
          value: RELEASE-NAME-psql

  - it: should NOT set CPU limits on psql
    asserts:
      - isNull:
          path: spec.template.spec.containers[0].resources.limits.cpu
        documentSelector:
          path: metadata.name
          value: RELEASE-NAME-psql

  # Image pull secrets
  - it: should have image pull secrets by default
    asserts:
      - contains:
          path: spec.template.spec.imagePullSecrets
          content:
            name: regcred
        documentSelector:
          path: metadata.name
          value: RELEASE-NAME-psql

  - it: should omit image pull secrets when global.imagePullSecrets is empty
    set:
      global.imagePullSecrets: []
    asserts:
      - isNull:
          path: spec.template.spec.imagePullSecrets
        documentSelector:
          path: metadata.name
          value: RELEASE-NAME-psql

