suite: test secrets configuration
templates:
  - secrets.yaml
values:
  - values/deployment-identifier.yaml
tests:
  # Basic secrets functionality
  - it: should create qualytics-creds secret
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: qualytics-creds
      - equal:
          path: type
          value: Opaque

  # QUA-2163: deployment identifier is required
  - it: should store deployment_identifier in qualytics-creds
    asserts:
      - equal:
          path: data.deployment_identifier
          value: dGVzdC1kZXBsb3ltZW50LWlkZW50aWZpZXI=

  - it: should reject the default passphrase on a new installation
    set:
      secrets.postgres.secrets_passphrase: "ChangeMe!"
    asserts:
      - failedTemplate:
          errorPattern: secrets.postgres.secrets_passphrase must be set to a unique, strong value

  # The JWT signing secret is the browser-session authority, so the published default is a
  # complete authentication bypass.
  - it: should reject the default jwt signing secret on a new installation
    set:
      secrets.auth.jwt_signing_secret: "ChangeMe!"
    asserts:
      - failedTemplate:
          errorPattern: secrets.auth.jwt_signing_secret must be set to a unique, strong value

  # global.authType is no longer read. Existing values files still carry "DB", sometimes next to a
  # leftover secrets.auth0 block, and must keep rendering; any other value would silently change
  # how users sign in, so it fails instead.
  - it: should accept a leftover DB authType next to leftover Auth0 settings
    set:
      global.authType: "DB"
      secrets.auth0.auth0_audience: "leftover-audience"
    asserts:
      - exists:
          path: data.jwt_signing_secret
      - notExists:
          path: data.auth0_audience

  - it: should reject a leftover AUTH0 authType
    set:
      global.authType: "AUTH0"
    asserts:
      - failedTemplate:
          errorPattern: global.authType "AUTH0" is no longer supported

  - it: should reject the removed OIDC authType
    set:
      global.authType: "OIDC"
    asserts:
      - failedTemplate:
          errorPattern: global.authType "OIDC" is no longer supported

  - it: should reject an empty authType
    set:
      global.authType: ""
    asserts:
      - failedTemplate:
          errorPattern: global.authType "" is no longer supported

  # The previous chart defaulted to Auth0, so a deployment that relied on the default carries
  # its secrets.auth0 values but no global.authType.
  - it: should reject Auth0 settings that relied on the former default
    set:
      secrets.auth0.auth0_audience: "real-audience"
    asserts:
      - failedTemplate:
          errorPattern: secrets.auth0 is set without global.authType "DB"

  # Rotation pairing: the DB counter starts at 1, so a staged passphrase left at id 1
  # targets an already-completed migration and re-encrypts nothing.
  - it: should reject a staged passphrase without an incremented migration id
    set:
      secrets.postgres.new_secrets_passphrase: "next-passphrase"
    asserts:
      - failedTemplate:
          errorPattern: secrets.postgres.secrets_migration_id must be incremented

  - it: should accept a staged passphrase with an incremented migration id
    set:
      secrets.postgres.new_secrets_passphrase: "next-passphrase"
      secrets.postgres.secrets_migration_id: 2
    asserts:
      - exists:
          path: data.new_secrets_passphrase

  - it: should fail rendering when deployment identifier is unset
    set:
      secrets.deployment.identifier: ""
    asserts:
      - failedTemplate:
          errorPattern: secrets.deployment.identifier is required

  - it: should omit identity-provider secrets
    asserts:
      - notExists:
          path: data.auth0_audience
      - notExists:
          path: data.auth0_spa_client_id
      - notExists:
          path: data.oidc_client_id
      - notExists:
          path: data.oidc_client_secret
      - exists:
          path: data.jwt_signing_secret

  # System secrets tests
  - it: should always create required system secrets
    set:
      secrets.auth.jwt_signing_secret: "custom_jwt_secret"
      secrets.postgres.secrets_passphrase: "custom_passphrase"
      secrets.rabbitmq.rabbitmq_password: "custom_rabbitmq_pass"
    asserts:
      - exists:
          path: data.jwt_signing_secret
      - exists:
          path: data.secrets_passphrase
      - exists:
          path: data.rabbitmq_password
      - exists:
          path: data.connection_url

  - it: should include the staged passphrase only during rotation
    set:
      secrets.postgres.new_secrets_passphrase: "next-passphrase"
      secrets.postgres.secrets_migration_id: 2
    asserts:
      - exists:
          path: data.new_secrets_passphrase

  # SMTP secrets tests
  - it: should create SMTP secrets when configured
    set:
      secrets.smtp.smtp_sender_user: "smtp_user"
      secrets.smtp.smtp_sender_password: "smtp_pass"
    asserts:
      - exists:
          path: data.smtp_sender_user
      - exists:
          path: data.smtp_sender_password

  # Defaults must stay empty: placeholder credentials force an SMTP AUTH attempt,
  # which relays lacking the AUTH extension reject at send time.
  - it: should not create SMTP secrets by default
    asserts:
      - notExists:
          path: data.smtp_sender_user
      - notExists:
          path: data.smtp_sender_password

  # Database connection secrets tests
  - it: should create database connection URL
    set:
      secrets.postgres.secrets_passphrase: "db_secret"
    asserts:
      - exists:
          path: data.connection_url

  # Comprehensive secrets test
  - it: should create all secret types when fully configured
    set:
      secrets.auth.jwt_signing_secret: "full_jwt_secret"
      secrets.postgres.secrets_passphrase: "full_db_secret"
      secrets.rabbitmq.rabbitmq_password: "full_rabbitmq_pass"
      secrets.smtp.smtp_sender_user: "full_smtp_user"
      secrets.smtp.smtp_sender_password: "full_smtp_pass"
    asserts:
      - equal:
          path: metadata.name
          value: qualytics-creds
      - exists:
          path: data.jwt_signing_secret
      - exists:
          path: data.secrets_passphrase
      - exists:
          path: data.rabbitmq_password
      - exists:
          path: data.smtp_sender_user

  # Observability (QUA-2402): keys render only when set
  - it: should omit observability keys by default
    asserts:
      - notExists:
          path: data.logfire_token
      - notExists:
          path: data.otlp_headers

  - it: should include observability keys when set
    set:
      secrets.observability.logfire_token: "pylf_test_token"
      secrets.observability.otlp_headers: "X-SF-Token=test123"
    asserts:
      - exists:
          path: data.logfire_token
      - exists:
          path: data.otlp_headers
