suite: test controlplane ServiceAccount
templates:
  - controlplane-sa.yaml
  - controlplane-api.yaml
  - controlplane-cmd.yaml
tests:
  - it: should not create a ServiceAccount or bind one by default
    asserts:
      - hasDocuments:
          count: 0
        template: controlplane-sa.yaml
      - notExists:
          path: spec.template.spec.serviceAccountName
        template: controlplane-api.yaml
        documentIndex: 0
      - notExists:
          path: spec.template.spec.serviceAccountName
        template: controlplane-cmd.yaml
        documentIndex: 0

  - it: should create a ServiceAccount named after the release and bind it to api and cmd
    set:
      controlplane.serviceAccount.create: true
    asserts:
      - isKind:
          of: ServiceAccount
        template: controlplane-sa.yaml
      - equal:
          path: metadata.name
          value: RELEASE-NAME-controlplane
        template: controlplane-sa.yaml
      # Both hub processes resolve LLM providers, so both need the identity — not just api.
      - equal:
          path: spec.template.spec.serviceAccountName
          value: RELEASE-NAME-controlplane
        template: controlplane-api.yaml
        documentIndex: 0
      - equal:
          path: spec.template.spec.serviceAccountName
          value: RELEASE-NAME-controlplane
        template: controlplane-cmd.yaml
        documentIndex: 0

  - it: should carry workload-identity annotations when given them
    set:
      controlplane.serviceAccount.create: true
      controlplane.serviceAccount.annotations:
        eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/tenant-controlplane
    asserts:
      - equal:
          path: metadata.annotations["eks.amazonaws.com/role-arn"]
          value: arn:aws:iam::123456789012:role/tenant-controlplane
        template: controlplane-sa.yaml

  - it: should carry no annotations block when none are given
    set:
      controlplane.serviceAccount.create: true
    asserts:
      - notExists:
          path: metadata.annotations
        template: controlplane-sa.yaml

  # create=false with a name is the BYO path: bind an existing ServiceAccount, create nothing.
  - it: should bind an existing ServiceAccount without creating one
    set:
      controlplane.serviceAccount.name: preexisting-sa
    asserts:
      - hasDocuments:
          count: 0
        template: controlplane-sa.yaml
      - equal:
          path: spec.template.spec.serviceAccountName
          value: preexisting-sa
        template: controlplane-api.yaml
        documentIndex: 0
      - equal:
          path: spec.template.spec.serviceAccountName
          value: preexisting-sa
        template: controlplane-cmd.yaml
        documentIndex: 0

  - it: should let an explicit name override the derived one
    set:
      controlplane.serviceAccount.create: true
      controlplane.serviceAccount.name: custom-sa
    asserts:
      - equal:
          path: metadata.name
          value: custom-sa
        template: controlplane-sa.yaml
      - equal:
          path: spec.template.spec.serviceAccountName
          value: custom-sa
        template: controlplane-api.yaml
        documentIndex: 0
