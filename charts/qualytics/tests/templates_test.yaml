suite: test essential templates render correctly
templates:
  - secrets.yaml
  - ingress.yaml
  - postgres.yaml
  - rabbitmq.yaml
values:
  - values/deployment-identifier.yaml
tests:
  # Secrets template tests
  - it: should render secrets without identity-provider credentials
    template: secrets.yaml
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: qualytics-creds
      - notExists:
          path: data.auth0_audience
      - notExists:
          path: data.oidc_client_id
      - exists:
          path: data.jwt_signing_secret

  # Ingress template tests
  - it: should render ingress when enabled
    template: ingress.yaml
    set:
      ingress.enabled: true
      global.dnsRecord: "test.qualytics.io"
    asserts:
      - hasDocuments:
          count: 3
      - isKind:
          of: Ingress
        documentIndex: 0

  # PostgreSQL template tests
  - it: should render postgres resources when enabled
    template: postgres.yaml
    set:
      postgres.enabled: true
    asserts:
      - hasDocuments:
          count: 6
      - isKind:
          of: StatefulSet
        documentIndex: 2

  # RabbitMQ template tests — default has pvc.enabled=false (emptyDir), so the
  # PVC document is omitted and the StatefulSet is doc 2, followed by the
  # governing Service (3).
  - it: should render rabbitmq resources
    template: rabbitmq.yaml
    asserts:
      - hasDocuments:
          count: 4
      - isKind:
          of: StatefulSet
        documentIndex: 2
